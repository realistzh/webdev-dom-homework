<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <!-- Комментарии рисует функция renderComments() -->
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    const listElement = document.querySelector('.comments');
    const nameInput = document.querySelector('.add-form-name');
    const textInput = document.querySelector('.add-form-text');
    const addButton = document.querySelector('.add-form-button');

    const comments = [
      {
        name: 'Глеб Фокин',
        date: '12.02.22 12:18',
        text: 'Это будет первый комментарий на этой странице',
        likes: 3,
        isLiked: false,
      },
      {
        name: 'Варвара Н.',
        date: '13.02.22 19:22',
        text: 'Мне нравится как оформлена эта страница! ❤',
        likes: 75,
        isLiked: true,
      },
    ];

    function formatDate(date) {
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = String(date.getFullYear()).slice(-2);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    // Защита от HTML-разметки: заменяем опасные символы на безопасные.
    // Важно: & заменяем первым, иначе испортим уже вставленные &lt; и т.п.
    function escapeHtml(str) {
      return str
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    // Лайки
    function initLikeButtons() {
      const likeButtons = document.querySelectorAll('.like-button');

      for (const likeButton of likeButtons) {
        likeButton.addEventListener('click', (event) => {
          // Не даем событию «всплыть» до карточки, иначе сработает ответ
          event.stopPropagation();

          const comment = comments[likeButton.dataset.index];

          if (comment.isLiked) {
            comment.likes--;
          } else {
            comment.likes++;
          }
          comment.isLiked = !comment.isLiked;

          renderComments();
        });
      }
    }

    // Ответ на комментарий по клику на карточку
    function initReplyHandlers() {
      const commentElements = document.querySelectorAll('.comment');

      for (const commentElement of commentElements) {
        commentElement.addEventListener('click', () => {
          const comment = comments[commentElement.dataset.index];

          // Берем исходный текст из массива (не экранированный),
          // экранирование произойдет при отрисовке
          textInput.value = `> ${comment.name}: ${comment.text}\n\n`;
          textInput.classList.remove('error');
          textInput.focus();
        });
      }
    }

    function renderComments() {
      listElement.innerHTML = comments
        .map((comment, index) => {
          return `
            <li class="comment" data-index="${index}">
              <div class="comment-header">
                <div>${escapeHtml(comment.name)}</div>
                <div>${comment.date}</div>
              </div>
              <div class="comment-body">
                <div class="comment-text">${escapeHtml(comment.text)}</div>
              </div>
              <div class="comment-footer">
                <div class="likes">
                  <span class="likes-counter">${comment.likes}</span>
                  <button
                    data-index="${index}"
                    class="like-button ${comment.isLiked ? '-active-like' : ''}"
                  ></button>
                </div>
              </div>
            </li>`;
        })
        .join('');

      initLikeButtons();
      initReplyHandlers();
    }

    nameInput.addEventListener('input', () => nameInput.classList.remove('error'));
    textInput.addEventListener('input', () => textInput.classList.remove('error'));

    addButton.addEventListener('click', () => {
      const name = nameInput.value.trim();
      const text = textInput.value.trim();

      nameInput.classList.toggle('error', name === '');
      textInput.classList.toggle('error', text === '');
      if (name === '' || text === '') return;

      comments.push({
        name: name,
        date: formatDate(new Date()),
        text: text,
        likes: 0,
        isLiked: false,
      });

      renderComments();

      nameInput.value = '';
      textInput.value = '';
    });

    renderComments();
  </script>
</html>
